[package]
name = "dl-engine"
version = "0.1.0"
edition = "2021"
description = "Safe Rust API over llama.cpp (pinned) + a thin C wrapper: RPC worker, host, stats"
publish = false
links = "dl_engine"

[features]
# Serialize/Deserialize for the public data types (used by the app to talk to its UI).
serde = ["dep:serde"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[build-dependencies]
cmake = "0.1"
